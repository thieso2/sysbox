name: Build static binaries (x86_64)

on:
  push:
    branches: [dockyard]
    tags: ["v*"]

env:
  GOWORK: "off"
  GONOSUMDB: "*"
  GONOSUMCHECK: "*"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          # .gitmodules uses relative URLs that resolve to this fork's owner.
          # First, init submodules (registers them in .git/config from .gitmodules)
          # and sync to resolve URLs, then override URLs for repos that don't
          # exist under the fork or need the fork's branch.
          git submodule init
          git submodule sync --recursive

          # Override non-forked submodules to point to nestybox
          git config submodule.sysbox-dockerfiles.url "https://github.com/nestybox/dockerfiles.git"
          git config submodule.sysbox-libs.url "https://github.com/nestybox/sysbox-libs.git"
          git config submodule.sysbox-pkgr.url "https://github.com/nestybox/sysbox-pkgr.git"

          git submodule update --recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.9"
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libseccomp-dev \
            libseccomp2 \
            pkg-config \
            libcap-dev \
            libaio-dev \
            protobuf-compiler \
            libprotobuf-dev \
            --no-install-recommends

      - name: Generate protobuf code
        run: |
          go install github.com/golang/protobuf/protoc-gen-go@latest
          cd sysbox-ipc && make sysbox-ipc

      - name: Build sysbox-runc (static)
        run: |
          cd sysbox-runc
          CGO_ENABLED=1 go build -buildvcs=false -trimpath \
            -tags "seccomp apparmor idmapped_mnt netgo osusergo" \
            -ldflags "-extldflags -static \
              -X 'main.version=$(cat ../VERSION)' \
              -X main.commitId=$(git rev-parse HEAD)" \
            -o build/amd64/sysbox-runc .

      - name: Build sysbox-fs (static)
        run: |
          cd sysbox-fs
          CGO_ENABLED=1 go build -buildvcs=false -trimpath \
            -tags "netgo osusergo" \
            -installsuffix netgo \
            -ldflags "-extldflags -static \
              -X 'main.version=$(cat ../VERSION)' \
              -X main.commitId=$(git rev-parse HEAD)" \
            -o build/amd64/sysbox-fs ./cmd/sysbox-fs

      - name: Build sysbox-mgr (static)
        run: |
          cd sysbox-mgr
          CGO_ENABLED=1 go build -buildvcs=false -trimpath \
            -tags "idmapped_mnt netgo osusergo" \
            -installsuffix netgo \
            -ldflags "-w -extldflags -static \
              -X 'main.version=$(cat ../VERSION)' \
              -X main.commitId=$(git rev-parse HEAD)" \
            -o build/amd64/sysbox-mgr .

      - name: Verify static linking
        run: |
          file sysbox-runc/build/amd64/sysbox-runc
          file sysbox-fs/build/amd64/sysbox-fs
          file sysbox-mgr/build/amd64/sysbox-mgr

      - name: Create release archive
        run: |
          mkdir -p release
          cp sysbox-runc/build/amd64/sysbox-runc release/
          cp sysbox-fs/build/amd64/sysbox-fs release/
          cp sysbox-mgr/build/amd64/sysbox-mgr release/
          tar -czf sysbox-static-x86_64.tar.gz -C release sysbox-runc sysbox-fs sysbox-mgr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sysbox-static-x86_64
          path: sysbox-static-x86_64.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sysbox-static-x86_64.tar.gz
