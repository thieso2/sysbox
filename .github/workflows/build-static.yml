name: Build static binaries (x86_64)

on:
  push:
    branches: [dockyard]
    tags: ["v*"]

env:
  GOWORK: "off"
  GONOSUMDB: "*"
  GONOSUMCHECK: "*"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          # .gitmodules uses relative URLs (../sysbox-fs.git) that resolve to
          # this fork's owner. For submodules that have a dockyard branch on the
          # fork, use that; otherwise fall back to nestybox upstream.
          owner="${{ github.repository_owner }}"
          for sub in sysbox-ipc sysbox-fs sysbox-mgr sysbox-runc; do
            if git ls-remote --exit-code "https://github.com/${owner}/${sub}.git" refs/heads/dockyard >/dev/null 2>&1; then
              git config "submodule.${sub}.url" "https://github.com/${owner}/${sub}.git"
              git config "submodule.${sub}.branch" "dockyard"
            else
              git config "submodule.${sub}.url" "https://github.com/nestybox/${sub}.git"
            fi
          done
          # Remaining submodules always come from nestybox
          for sub in sysbox-libs sysbox-pkgr; do
            git config "submodule.${sub}.url" "https://github.com/nestybox/${sub}.git"
          done
          git config "submodule.sysbox-dockerfiles.url" "https://github.com/nestybox/dockerfiles.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.9"
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libseccomp-dev \
            libseccomp2 \
            pkg-config \
            libcap-dev \
            libaio-dev \
            protobuf-compiler \
            libprotobuf-dev \
            --no-install-recommends

      - name: Generate protobuf code
        run: |
          go install github.com/golang/protobuf/protoc-gen-go@latest
          cd sysbox-ipc && make sysbox-ipc

      - name: Build sysbox-runc (static)
        run: |
          cd sysbox-runc
          CGO_ENABLED=1 go build -buildvcs=false -trimpath \
            -tags "seccomp apparmor idmapped_mnt netgo osusergo" \
            -ldflags "-extldflags -static \
              -X 'main.version=$(cat ../VERSION)' \
              -X main.commitId=$(git rev-parse HEAD)" \
            -o build/amd64/sysbox-runc .

      - name: Build sysbox-fs (static)
        run: |
          cd sysbox-fs
          CGO_ENABLED=1 go build -buildvcs=false -trimpath \
            -tags "netgo osusergo" \
            -installsuffix netgo \
            -ldflags "-extldflags -static \
              -X 'main.version=$(cat ../VERSION)' \
              -X main.commitId=$(git rev-parse HEAD)" \
            -o build/amd64/sysbox-fs ./cmd/sysbox-fs

      - name: Build sysbox-mgr (static)
        run: |
          cd sysbox-mgr
          CGO_ENABLED=1 go build -buildvcs=false -trimpath \
            -tags "idmapped_mnt netgo osusergo" \
            -installsuffix netgo \
            -ldflags "-w -extldflags -static \
              -X 'main.version=$(cat ../VERSION)' \
              -X main.commitId=$(git rev-parse HEAD)" \
            -o build/amd64/sysbox-mgr .

      - name: Verify static linking
        run: |
          file sysbox-runc/build/amd64/sysbox-runc
          file sysbox-fs/build/amd64/sysbox-fs
          file sysbox-mgr/build/amd64/sysbox-mgr

      - name: Create release archive
        run: |
          mkdir -p release
          cp sysbox-runc/build/amd64/sysbox-runc release/
          cp sysbox-fs/build/amd64/sysbox-fs release/
          cp sysbox-mgr/build/amd64/sysbox-mgr release/
          tar -czf sysbox-static-x86_64.tar.gz -C release sysbox-runc sysbox-fs sysbox-mgr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sysbox-static-x86_64
          path: sysbox-static-x86_64.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sysbox-static-x86_64.tar.gz
